  help: Include nls-python skill

has_java:
  type: bool
  default: false
  help: Include nls-java skill

has_sql:
  type: bool
  default: false
  help: Include nls-sql skill

has_ansible:
  type: bool
  default: false
  help: Include nls-ansible skill

has_jenkins:
  type: bool
  default: false
  help: Include nls-jenkins skill

has_qgis:
  type: bool
  default: false
  help: Include nls-qgis skill

has_airflow:
  type: bool
  default: false
  help: Include nls-airflow skill

# =============================================================================
# External Agent Skills (vendored from third-party repos)
# =============================================================================

use_external_skills:
  type: bool
  help: "Vendor curated external Agent Skills into .agents/skills/?"
  default: false

external_skills:
  type: str
  multiselect: true
  help: "Which external skills to vendor? (see external-skills/registry.yml for sources)"
  choices:
    - pyqgis-dev
    - qgis4-migration
    - ansible-good-practices
    - ansible-new-molecule
    - ansible-new-role
  default: []
  when: "{{ use_external_skills }}"


_subdirectory: template

_tasks:
  - "python3 {{ _copier_conf.src_path }}/scripts/vendor_external_skills.py"

_min_copier_version: "9.10.0"
