# Curated allow-list of external Agent Skills sources.

pyqgis-dev:
  repo: https://github.com/GispoCoding/pyqgis-skills.git
  folder: gispo-coding-pyqgis
  subpath: skills/pyqgis-dev
  ref: 9753052d1135b1ffbcd520efe0d2191fb52c1dcc
  ref_label: corresponds to v0.3.0
  license: MIT
  notes: >
    Day-to-day PyQGIS/PyQt API lookups (live QGIS Python, then SIP
    bindings, then C++ sources; stubs last). Requires a local QGIS
    install with Python (see upstream README "Configure" section) -
    one-time per-developer-machine setup this task does NOT handle.

qgis4-migration:
  repo: https://github.com/GispoCoding/pyqgis-skills.git
  folder: gispo-coding-pyqgis
  subpath: skills/qgis4-migration
  ref: 9753052d1135b1ffbcd520efe0d2191fb52c1dcc
  ref_label: corresponds to v0.3.0
  license: MIT
  notes: >
    QGIS 3 (Qt5) -> QGIS 4 (Qt6) plugin migration procedure. Refers to
    pyqgis-dev's scripts by relative path - vendor both together or not
    at all.

ansible-good-practices:
  repo: https://github.com/leogallego/claude-ansible-skills.git
  folder: leogallego-ansible
  subpath: ansible-good-practices/skills/ansible-good-practices
  ref: 2c43de8f4b180342f05f5e670cc7e6e8ae359ec4
  ref_label: corresponds to v1.2.4
  license: GPLv3
  extra_paths:
    - subpath: ansible-good-practices/references
      dest: references
  notes: >
    Review Ansible code against Red Hat CoP automation good practices.
    Use when the user wants to audit, lint, review, check, or validate
    Ansible roles, playbooks, collections, or inventory
    for compliance with CoP rules.

ansible-new-molecule:
  repo: https://github.com/leogallego/claude-ansible-skills.git
  folder: leogallego-ansible
  subpath: ansible-new-molecule/skills/ansible-new-molecule
  ref: 2c43de8f4b180342f05f5e670cc7e6e8ae359ec4
  ref_label: corresponds to v1.2.4
  license: GPLv3
  extra_paths:
    - subpath: ansible-new-molecule/references
      dest: references
  notes: >
    Scaffold molecule testing for an Ansible role or collection following
    the current molecule testing philosophy (Ansible-native everything).
    SKILL.md loads reference docs (e.g. molecule-patterns.md) via relative
    "references/..." paths, so the sibling references/ directory is
    vendored alongside SKILL.md.

ansible-new-role:
  repo: https://github.com/leogallego/claude-ansible-skills.git
  folder: leogallego-ansible
  subpath: ansible-new-role/skills/ansible-new-role
  ref: 2c43de8f4b180342f05f5e670cc7e6e8ae359ec4
  ref_label: corresponds to v1.2.4
  license: GPLv3
  extra_paths:
    - subpath: ansible-new-role/references
      dest: references
  notes: >
    Scaffold a new Ansible role following Red Hat CoP good practices.
    Requires ansible-creator for generated skeletons when available
    (otherwise falls back to manual scaffolding); optionally uses the
    ansible-know MCP server for module-aware task generation. SKILL.md
    loads bundled references, so the sibling references/ directory is
    vendored alongside it.
